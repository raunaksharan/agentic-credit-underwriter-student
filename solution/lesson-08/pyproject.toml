[project]
name = "agentic-credit-underwriter"
version = "0.1.0"
description = "FDE Academy capstone: an agentic credit underwriting platform, from business workflow to production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "langgraph>=1.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.7",
    "pypdf>=5",
]

[project.optional-dependencies]
# Lesson 2 added pypdf + beautifulsoup4 (parsing). BM25, the hashing embedder and
# RRF are written out in src/underwriter/rag so students can read every line.
# Lesson 3: real LLM providers are optional. `uv sync --extra llm`, then LLM_MODE=live.
llm = ["litellm>=1.50"]
# Lesson 7: send traces to Jaeger, Tempo or any OTLP backend. OTEL_EXPORTER=otlp.
otel = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
# Lesson 5 added langgraph (a core dependency): the workflow is a graph.

[project.scripts]
underwriter = "underwriter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
