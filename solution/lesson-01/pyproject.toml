[project]
name = "agentic-credit-underwriter"
version = "0.1.0"
description = "FDE Academy capstone: an agentic credit underwriting platform, from business workflow to production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Later lessons add these as they become relevant:
#   lesson 2 (RAG):        "psycopg[binary]", "pgvector", "rank-bm25"
#   lesson 3-5 (LLM/agents): "langgraph", "langchain-core", "litellm"
#   lesson 7 (observability): "opentelemetry-sdk"
#   lesson 9 (API):        "fastapi", "uvicorn"

[project.scripts]
underwriter = "underwriter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
