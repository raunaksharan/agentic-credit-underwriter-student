name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Smoke-run the pipeline on every sample application
        run: uv run underwriter run-all
